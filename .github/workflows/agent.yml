name: Jev agent offline

on:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-offline:
    if: github.repository == 'cmoyates/melee'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: agent/src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'
      - name: Asset-free capability check
        run: python -B -m melee_agent.cli doctor --json --require offline
      - name: Contract, result, ownership and negative-output tests
        run: python -B -m unittest discover -s agent/tests -v
      - name: Repeat the shared frame-to-controller slice
        run: python -B -m melee_agent.cli smoke --backend fake
